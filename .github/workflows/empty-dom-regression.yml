name: Empty DOM regression

on:
  push:
    branches: [codex/empty-dom-regression]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test tests/browser-response-dom.test.ts -t "empty visual wrapper"
